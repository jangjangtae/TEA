defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False, use_logdir: True}
    craftax: {logs: True, length: 10000, use_seed: True, platform: cpu}
    hasard: {size: [64, 64], root: /mnt/ssd2tb/src/HASARD, resolution: 160X120, frame_skip: 4, use_seed: True, full_actions: False, hard_constraint: False}
    coom: {root: .deps/COOM, size: [64, 64], repeat: 4, length: 0, use_seed: True, sparse_rewards: False, resolution: 160X120, frame_stack: 1, action_space: multi, reward_scaler_traversal: -1.0, reward_kill_rag: -1.0}
    minigrid: {obs_mode: symbolic, size: [64, 64], tile_size: 8, length: 360, use_seed: True, fault_profile: clean, progress_reward: False, progress_key_reward: 0.1, progress_door_reward: 0.2, progress_position_reward: 0.01, action_set: full}
    minatar: {sticky_action_prob: 0.1, difficulty_ramping: True, minimal_actions: False, length: 10000, use_seed: True}
    vizdoom: {size: [64, 64], repeat: 4, length: 300, use_seed: True, scenarios: '', action_set: single, variables: True, gray: False, doom_skill: 3, no_monsters: False, fault_profile: clean, episode_prob: 0.0, manifest_prob: 1.0, severity: 0.25, cooldown: 8, route_mode: random_basic, progress_reward: False, progress_cell_size: 384.0, progress_cell_reward: 0.03, progress_item_reward: 0.08, progress_kill_reward: 0.05, progress_secret_reward: 0.10, progress_step_penalty: 0.0, progress_max_cell_reward: 1.2, progress_use_reward: 0.0, progress_attack_reward: 0.0, progress_ammo_reward: 0.0, progress_health_reward: 0.0, progress_armor_reward: 0.0, progress_damage_penalty: 0.0, progress_max_interaction_reward: 0.0}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1}

  replay:
    size: 5e6
    storage: ram
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  fault:
    enabled: False
    ref_ckpt: ''
    norm_stats: ''
    beta: 0.1
    clip: 1.0
    use_latent_kl: True
    use_reward_error: True
    use_recon_error: False
    use_kl_bound: False
    score_source: latent_reward
    task_reward_source: delivered
    log_only: True
    w_kl: 1.0
    w_reward: 1.0
    norm_mode: p95
    reward_mode: dense
    reward_threshold: 1.0
    reward_delta_threshold: 0.5
    reward_gate: none
    context_min_count: 50
    semantic_coverage_beta: 0.0
    unique_suspicious_beta: 0.0
    repeat_suspicious_penalty: 0.0
    suspicious_threshold: 1.0
    adaptive_beta: False
    adaptive_task_target: 0.0
    adaptive_beta_down: 0.9
    adaptive_beta_up: 1.05
    adaptive_beta_min: 0.0
    adaptive_beta_max: 1.0
    adaptive_task_ema: 0.1
    constraint_mode: none
    constraint_task_target: 0.0
    constraint_lambda_init: 1.0
    constraint_lambda_lr: 0.05
    constraint_lambda_min: 0.0
    constraint_lambda_max: 10.0
    constraint_novelty_scale: 1.0
    constraint_task_scale: 1.0
    constraint_warmup_episodes: 10
    trace: fault_score_trace.jsonl

  calibration:
    episodes: 100
    steps: 0
    out: ''
    trace: ''

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    compilation_cache: True
    gpuflags: True
    autotune: 1
    deterministic: True
    expect_devices: 0
    enable_policy: True
    prefetch: True
    profiler: True
    donate_train: True
    coordinator_address: ''

  agent:
    obs_exclude: [none]
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

